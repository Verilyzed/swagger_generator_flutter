name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # example/ is a Flutter app; the Dart-only SDK here cannot resolve it.
      - run: dart pub get --no-example
      - run: dart analyze
      - run: dart test
